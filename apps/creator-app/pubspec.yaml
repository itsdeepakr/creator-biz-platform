name: creator_app
description: Creator mobile app for the Creator-Business Platform

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.1
  web_socket_channel: ^2.4.5

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Images & Media
  cached_network_image: ^3.4.0

  # UI Utilities
  intl: ^0.19.0
  timeago: ^3.6.1

  # Utilities
  uuid: ^4.4.2
  path: ^1.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
